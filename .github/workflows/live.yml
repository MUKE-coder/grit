# The generated app, running, on every supported Postgres.
#
# Grit's hardest bugs were never found by unit tests. They were found by
# building a real application and using it: an export that returned an empty
# file with a 200, a list that handed one user another user's rows, a save that
# silently overwrote a newer one, a replace that appended. Each was fixed and
# verified by hand, once.
#
# This job is that verification, kept. It scaffolds a project, generates the
# resource shapes the bugs lived in, migrates, starts the server and drives it
# over HTTP, checking the database directly where the database is the only
# witness (whether a column is ciphertext, whether a move rewrote a subtree).
#
# The matrix exists because these are database behaviours. RETURNING, the
# sliding-window rate limits, a materialised-path rewrite with REPLACE, and
# FindInBatches paging all depend on the dialect, and Grit claims Postgres 15
# through 17.
name: Live

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: generated app on postgres ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15", "16", "17"]

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: grit
          POSTGRES_PASSWORD: grit
          POSTGRES_DB: grit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://grit:grit@localhost:5432/grit?sslmode=disable
      REDIS_URL: redis://localhost:6379
      APP_PORT: "8080"
      APP_ENV: development
      JWT_SECRET: ci-jwt-secret-0123456789abcdef0123456789abcdef
      # Without a key, crypto.EncryptedString stores the value as it is, and the
      # "not readable in the database" check would pass for the wrong reason.
      FIELD_ENCRYPTION_KEY: K3hQ8vZ2mP5sT7wY0bD4fG6jL9nR1uX3cV5aE8hK2oQ=

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          check-latest: true
          cache: true

      - name: Build grit from this commit
        run: |
          go build -o /usr/local/bin/grit ./cmd/grit
          grit version

      # The shapes are the ones the bugs lived in: an owned resource, a tree, a
      # public surface, money, an encrypted column, a relation, a line-items
      # child. Tag and Category come first because the relations resolve them.
      - name: Scaffold the fixture app
        run: |
          mkdir -p /tmp/live && cd /tmp/live
          grit new app --api
          cd app
          grit generate resource Tag --fields "name:string"
          grit generate resource Lot --fields "title:string,current_bid:int"
          grit generate resource Note --fields "body:text" --owned-by user
          grit generate resource Category --fields "name:string,slug:slug" --tree --public
          grit generate resource Product \
            --fields "name:string,slug:slug,price:money,secret:text:encrypted,category:belongs_to:Category,tags:many_to_many:Tag" \
            --public
          grit generate resource Invoice --fields "number:string" \
            --items "InvoiceItem:description:string,qty:int,unit_rate:float"

      - name: Build, vet and test the generated API
        run: |
          cd /tmp/live/app/apps/api
          go build ./...
          go vet ./...
          go test ./... 2>&1 | tail -30

      - name: Audit the generated project
        run: |
          cd /tmp/live/app
          grit doctor || true   # reported, not gating: a fixture has no secrets set

      - name: Migrate
        run: |
          cd /tmp/live/app/apps/api
          go run ./cmd/migrate

      - name: Start the API
        run: |
          cd /tmp/live/app/apps/api
          go build -o /tmp/live/server ./cmd/server
          /tmp/live/server > /tmp/live/server.log 2>&1 &
          echo "started"

      - name: Live checks
        run: |
          python3 tests/live/verify.py http://localhost:8080 \
            --db grit --db-user grit --db-password grit \
            --db-host localhost --db-port 5432

      # Down migrations, against a real Postgres.
      #
      # AutoMigrate has no down scripts, so a rollback is computed from what a run
      # recorded. None of that shows up in an HTTP response: the only proof is the
      # column being there and then not, which is what this checks.
      - name: Roll back a migration
        env:
          PGPASSWORD: grit
        run: |
          set -euo pipefail

          column() {
            psql -h localhost -U grit -d grit -tAc \
              "select count(*) from information_schema.columns where table_name='tags' and column_name='$1'" \
              | tr -d '[:space:]'
          }
          table() {
            psql -h localhost -U grit -d grit -tAc \
              "select count(*) from information_schema.tables where table_name='$1'" \
              | tr -d '[:space:]'
          }

          # A column on a table that already has rows, which is the case a rollback
          # has to get right: dropping the table instead would take the rest.
          cd /tmp/live/app
          grit generate field Tag colour:text
          cd apps/api
          go run ./cmd/migrate --grit-version ci

          test "$(column colour)" = "1" || { echo "the migration did not add the column"; exit 1; }
          go run ./cmd/migrate --status | tail -20

          # --dry-run prints the statements and changes nothing.
          go run ./cmd/migrate --down --dry-run
          test "$(column colour)" = "1" || { echo "--dry-run dropped the column"; exit 1; }

          go run ./cmd/migrate --down --yes
          test "$(column colour)" = "0" || { echo "the rollback left the column behind"; exit 1; }
          test "$(table tags)" = "1" || { echo "the rollback dropped the table, not the column"; exit 1; }

          # With that run undone, the only one left is the baseline that built the
          # schema, and it is refused rather than dropping the database out from
          # under the application. (That a half-applied rollback can be re-run is
          # covered by the tests shipped in internal/migrate.)
          if go run ./cmd/migrate --down --yes; then
            echo "rolling back the baseline should have failed"
            exit 1
          fi
          echo "down migrations verified"

      # The server log is where a 500 explains itself, and it is gone with the
      # runner unless it is kept.
      - name: Server log
        if: failure()
        run: tail -200 /tmp/live/server.log || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: live-postgres-${{ matrix.postgres }}
          path: /tmp/live/server.log
          retention-days: 14

  tenancy:
    name: tenancy, roles and impersonation together
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: grit
          POSTGRES_PASSWORD: grit
          POSTGRES_DB: grit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://grit:grit@localhost:5432/grit?sslmode=disable
      REDIS_URL: redis://localhost:6379
      APP_PORT: "8080"
      APP_ENV: development
      JWT_SECRET: ci-jwt-secret-0123456789abcdef0123456789abcdef
      FIELD_ENCRYPTION_KEY: K3hQ8vZ2mP5sT7wY0bD4fG6jL9nR1uX3cV5aE8hK2oQ=
      PGPASSWORD: grit

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          check-latest: true
          cache: true

      - name: Build grit from this commit
        run: |
          go build -o /usr/local/bin/grit ./cmd/grit
          grit version

      # The combination, not the parts: the multitenant plugin and the impersonate
      # plugin, a tenant-owned resource, and one that is tenant-owned AND has an
      # owner, which is where an organization and an owner meet on the same row.
      - name: Scaffold the fixture
        run: |
          mkdir -p /tmp/tenancy && cd /tmp/tenancy
          grit new app --api
          cd app
          grit plugin add multitenant
          grit plugin add impersonate
          grit generate resource Deal \
            --fields "title:string,amount:money,stage:select:new=New|won=Won|lost=Lost" \
            --tenant-owned
          grit generate resource Contact --fields "name:string,email:string" \
            --tenant-owned --owned-by user

      # The ordering bug that broke every DELETE was invisible in a build and
      # obvious in a grep, so both run.
      - name: Build, vet and check the middleware order
        run: |
          cd /tmp/tenancy/app/apps/api
          go build ./...
          go vet ./...
          grep -n "Tenant(db)" internal/routes/routes.go
          test "$(grep -c 'Use(middleware.Tenant(db))' internal/routes/routes.go)" = "3" \
            || { echo "the tenant middleware is not on all three authenticated groups"; exit 1; }
          python3 - <<'PY'
          import io, sys
          src = io.open('internal/routes/routes.go', encoding='utf-8').read().splitlines()
          def line_of(needle):
              for i, line in enumerate(src):
                  if needle in line:
                      return i
              sys.exit('not found: ' + needle)
          if line_of('staff.Use(middleware.Tenant(db))') > line_of('staff.Use(middleware.RequireStaff())'):
              sys.exit('the tenant middleware runs after RequireStaff, so an organization role grants nothing')
          print('middleware order is auth, then plugins, then the gate')
          PY

      - name: Migrate
        run: |
          cd /tmp/tenancy/app/apps/api
          go run ./cmd/migrate --grit-version ci

      - name: Start the API
        run: |
          cd /tmp/tenancy/app/apps/api
          go build -o /tmp/tenancy/server ./cmd/server
          /tmp/tenancy/server > /tmp/tenancy/server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/api/health > /dev/null && break
            sleep 1
          done

      - name: The seams
        run: |
          python3 tests/live/verify_tenancy.py http://localhost:8080 \
            --db grit --db-user grit --db-password grit \
            --db-host localhost --db-port 5432

      - name: Server log
        if: failure()
        run: tail -200 /tmp/tenancy/server.log || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: tenancy-server-log
          path: /tmp/tenancy/server.log
          retention-days: 14
