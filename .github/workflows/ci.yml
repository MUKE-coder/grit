name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          check-latest: true
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        run: go test ./... -v -race -count=1

      - name: Check test coverage
        run: go test ./... -coverprofile=coverage.out -covermode=atomic

      # Coverage is informational, so a bad upload must not fail the build.
      #
      # fail_ci_if_error: false covers codecov rejecting the report. It does not
      # cover the action itself erroring before it gets that far, which is what
      # happened on v3.363.0: an SSL handshake failure against codecov turned a
      # green test run red and made the release look broken. continue-on-error
      # is the one that holds for both.
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          file: coverage.out
          fail_ci_if_error: false

  example:
    name: The checked-in example application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          check-latest: true
          cache: true

      # examples/library is a real Grit application, generated and committed.
      #
      # The Live workflow proves that today's templates produce a working
      # application. This proves something else, and something nobody else
      # checks: that an application generated at an earlier version still
      # builds, vets and passes its own tests against today's libraries. That is
      # the question every existing user has, and a fresh scaffold cannot ask it
      # because it is never old.
      #
      # It is its own Go module, so the root `go test ./...` never sees it.
      - name: Build, vet and test it
        working-directory: examples/library/apps/api
        run: |
          # pipefail: without it the step reports tee's exit code, and a
          # failing example passes CI.
          set -o pipefail
          gofmt -l . | tee /tmp/unformatted
          test ! -s /tmp/unformatted
          go build ./...
          go vet ./...
          go test ./... 2>&1 | tail -40

      # The one hand-written file in the example is a policy rule, and the
      # claim it makes is that a returned loan cannot be edited. Run on its own
      # so a failure names the thing that broke rather than being one line in a
      # wall of output.
      - name: The policy rule still holds
        working-directory: examples/library/apps/api
        run: go test ./internal/handlers/ -run 'TestAReturnedLoan|TestDeletingIsJudged' -v

      # examples/commerce is the second one: a shop, with a hand-written cart on
      # top of generated models. It is here for a reason library cannot cover,
      # which is that its hand-written half calls into generated code rather than
      # sitting beside it. The cart service asks the variant service to resolve a
      # price and reads the option-value association to build a label, so a
      # change to either signature fails here rather than in somebody's shop.
      - name: Build, vet and test the shop
        working-directory: examples/commerce/apps/api
        run: |
          set -o pipefail
          gofmt -l . | tee /tmp/unformatted-shop
          test ! -s /tmp/unformatted-shop
          go build ./...
          go vet ./...
          go test ./... 2>&1 | tail -40

      # The storefront type-checks against the Go side's published shapes. A
      # price typed as a string, or a field dropped from the public allowlist,
      # is a type error here and nothing at all at runtime until a page renders
      # "[object Object]".
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: The storefront type-checks
        working-directory: examples/commerce
        run: |
          pnpm install --frozen-lockfile=false
          cd apps/web && npx tsc --noEmit

      # TUTORIAL.md embeds every hand-written file whole, spliced from the real
      # ones by scripts/tutorial-build.py. A tutorial that paraphrases its code
      # goes stale without anyone noticing, and a reader following it stops at
      # the first file that no longer matches. This fails instead.
      - name: The tutorial matches the code it teaches
        run: python scripts/tutorial-build.py --check

  demo:
    name: Grit Motors, the live demo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          check-latest: true
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # demo/ is Grit Motors, the application behind demo.gritframework.dev, and
      # CONTRIBUTING.md says so. Nothing built it until now, which meant the one
      # application in this repository with a public URL was also the one nobody
      # would notice breaking.
      #
      # It is a --single app: the Go binary embeds the built frontend through
      # //go:embed all:frontend/dist, and frontend/dist is generated rather than
      # committed. So the frontend has to be built first or the Go build fails
      # on a pattern with no matching files, which is what `make build` does and
      # what this repeats.
      - name: Build the frontend it embeds
        working-directory: demo/frontend
        run: |
          pnpm install --no-frozen-lockfile
          pnpm build

      # Pinned at an older Grit version on purpose, like any real deployed
      # application. That makes this the one check that asks whether an
      # application generated a long time ago still builds and passes its tests
      # against today's libraries.
      - name: Build, vet and test it
        working-directory: demo
        run: |
          # pipefail: without it the step reports tee's exit code, and a failing
          # demo passes CI.
          set -o pipefail
          gofmt -l . | grep -v '^frontend/' | tee /tmp/demo-unformatted || true
          test ! -s /tmp/demo-unformatted
          go build ./...
          go vet ./...
          go test ./... 2>&1 | tail -30

  security:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          check-latest: true
          cache: true

      - name: go vet
        run: go vet ./...

      # govulncheck reports only vulnerabilities in code paths actually reached,
      # so a finding here is exploitable rather than merely present in the module
      # graph. That makes failing the build on it reasonable.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # gosec, with the rules a file-writing program trips by construction
      # excluded: writing files at paths built from its own inputs is what a
      # scaffolder is, and an email template that says "password" is not a
      # credential. Those rules produced 500 findings and would have taught
      # everyone to ignore the scanner. What is left is zero across 317 files,
      # so anything it reports next is new: SQL building, weak crypto, weak
      # randomness, unsafe TLS, a conversion that can truncate.
      #
      # The generated application is scanned separately, in scan.yml.
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -exclude=G104,G301,G302,G304,G306,G703,G706,G122,G204,G101 ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          check-latest: true
          cache: true

      - name: Build CLI
        run: go build -o grit ./cmd/grit

      - name: Verify binary
        run: ./grit --help

  build-matrix:
    name: Cross-platform build
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          check-latest: true
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w" -o grit-${{ matrix.suffix }} ./cmd/grit

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: grit-${{ matrix.suffix }}
          path: grit-${{ matrix.suffix }}
          retention-days: 7
