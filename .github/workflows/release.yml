name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Keyless signing and provenance both mint a short-lived OIDC token instead of
  # using a long-lived key. There is no signing key in this repo to leak.
  id-token: write
  attestations: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          check-latest: true
          cache: true

      - name: Run tests
        run: go test ./... -v -race

      - name: Build release binaries
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          LDFLAGS="-s -w -X main.Version=${VERSION}"

          # -trimpath drops local filesystem paths from the binary, so the same
          # source produces the same bytes regardless of where it was built.
          GOOS=linux   GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="$LDFLAGS" -o dist/grit-linux-amd64   ./cmd/grit
          GOOS=linux   GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="$LDFLAGS" -o dist/grit-linux-arm64   ./cmd/grit
          GOOS=darwin  GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="$LDFLAGS" -o dist/grit-darwin-amd64  ./cmd/grit
          GOOS=darwin  GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="$LDFLAGS" -o dist/grit-darwin-arm64  ./cmd/grit
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="$LDFLAGS" -o dist/grit-windows-amd64.exe ./cmd/grit

          # Tarballs for unix, zip for windows.
          cd dist
          tar czf grit-linux-amd64.tar.gz  grit-linux-amd64
          tar czf grit-linux-arm64.tar.gz  grit-linux-arm64
          tar czf grit-darwin-amd64.tar.gz grit-darwin-amd64
          tar czf grit-darwin-arm64.tar.gz grit-darwin-arm64
          zip grit-windows-amd64.zip grit-windows-amd64.exe

          # One checksum file over the distributed archives. Signing this single
          # file covers all of them.
          sha256sum *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS

      # Installed by hand rather than via anchore/sbom-action so this can retry.
      # A single 504 from the GitHub CDN fetching syft once aborted an entire
      # release, leaving a tag with no binaries attached — the SBOM is a
      # guarantee we make in SECURITY.md, so it must not be silently skipped,
      # but neither should one flaky download cost the release.
      - name: Generate SBOM
        env:
          SYFT_VERSION: v1.42.3
        run: |
          for attempt in 1 2 3; do
            if curl -sSfL https://get.anchore.io/syft | sh -s -- -b /usr/local/bin "$SYFT_VERSION"; then
              break
            fi
            echo "syft install attempt $attempt failed; retrying in 15s"
            sleep 15
          done
          syft version
          # node_modules is excluded because scanning it takes minutes and adds
          # nothing: the published artifact is a Go binary, and every npm package
          # that matters is already recorded via its lockfile.
          syft dir:. --exclude './**/node_modules/**' --exclude './**/.next/**' -o spdx-json > dist/grit-sbom.spdx.json
          # An empty or truncated SBOM is worse than none: it would pass a
          # scanner and report nothing.
          python3 -c "import json,sys; d=json.load(open('dist/grit-sbom.spdx.json')); n=len(d.get('packages',[])); print(f'SBOM packages: {n}'); sys.exit(1 if n == 0 else 0)"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the checksums
        run: |
          cd dist
          # Keyless: the certificate binds the signature to this workflow's
          # identity and the whole thing is logged in Rekor, so a signature
          # cannot be produced outside a real run of this file.
          cosign sign-blob --yes \
            --output-certificate SHA256SUMS.pem \
            --output-signature   SHA256SUMS.sig \
            SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/grit-linux-amd64.tar.gz
            dist/grit-linux-arm64.tar.gz
            dist/grit-darwin-amd64.tar.gz
            dist/grit-darwin-arm64.tar.gz
            dist/grit-windows-amd64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/grit-linux-amd64.tar.gz
            dist/grit-linux-arm64.tar.gz
            dist/grit-darwin-amd64.tar.gz
            dist/grit-darwin-arm64.tar.gz
            dist/grit-windows-amd64.zip
            dist/SHA256SUMS
            dist/SHA256SUMS.pem
            dist/SHA256SUMS.sig
            dist/grit-sbom.spdx.json
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
