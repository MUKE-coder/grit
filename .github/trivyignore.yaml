# Trivy findings the generated-app scan accepts, with the reason and the date
# the acceptance expires.
#
# This is the dependency-graph scanner, so it reports what is present. The
# reachability question is answered by govulncheck in the same job, and a
# called vulnerability still fails the build unless it is in
# .github/govulncheck-allow.txt. Nothing here is called.
#
# An expiry rather than a permanent entry: every line is a bet that upstream
# will ship a release, and a bet nobody re-examines is how a known hole becomes
# a permanent one.

vulnerabilities:
  # A run of denial-of-service findings in excelize, all of the same shape: a
  # crafted .xlsx makes it allocate without bound, recurse without bound or
  # compute an out-of-range coordinate.
  #
  # v2.11.0 is the newest tagged release and every one of these is fixed only
  # on master. Trivy reports the fix as a pseudo-version
  # (2.11.1-0.2026...-<commit>), which is a commit, not a release.
  #
  # Adopting an untagged upstream commit into every generated project is the
  # worse risk. All of them need a hostile spreadsheet, and a Grit project
  # reads one only through an import an authenticated operator starts, and
  # govulncheck reports none of them as called.
  #
  # Delete this whole block the day excelize tags v2.11.1, and raise the pin in
  # internal/scaffold/api_files.go. If that has not happened by the expiry,
  # the question to ask is whether Grit should still be importing it.
  - id: CVE-2026-107211
    statement: "excelize DoS on a hostile .xlsx; fixed on master only, no tagged release. Not called, per govulncheck."
    expired_at: 2026-12-31
