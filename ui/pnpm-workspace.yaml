# next pulls in sharp for image optimisation, and sharp runs an install script
# to fetch its native binaries. pnpm 10+ refuses to run any dependency's build
# script until it is approved, and treats an unapproved one as a hard error — so
# the Docker build failed *after* the install had otherwise succeeded.
#
# pnpm writes this file with the value "set this to true or false" and waits for
# a decision. Leaving that placeholder in place is the same as saying no, which
# is what shipped and what broke the deploy.
#
# This file is the ONLY place the approval lives. pnpm 11 no longer reads the
# `pnpm` field in package.json and warns on every install if you leave one
# there, so the belt-and-braces copy was removed. The Dockerfile pins pnpm to
# 11.9.0 and copies this file into the deps stage before installing.
allowBuilds:
  sharp: true
