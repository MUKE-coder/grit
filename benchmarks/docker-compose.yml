# Grit vs everyone — benchmark harness.
#
# The point of this file is that nobody gets an advantage:
#
#   - one Postgres, shared, tuned once, with more CPU than any app so the
#     database is never the thing that gives out first
#   - identical CPU and memory limits on every app container
#   - every app in production shape, never a dev server
#   - one database per framework, all created from seed/schema.sql, so the
#     table is byte-identical rather than whatever each ORM's migration emits
#
# Run one app at a time — an idle container still schedules. ./final.sh handles
# the start/stop and the per-run dataset reset itself.
#
#   docker compose up -d postgres
#   ./final.sh

x-app-limits: &app-limits
  # Change this and you change it for everyone. That is the point.
  deploy:
    resources:
      limits:
        cpus: "4"
        memory: 2G

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
    ports:
      - "5499:5432"
    command:
      - postgres
      - -c
      - max_connections=400
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=16MB
      # Durability off. This is a framework benchmark, not a storage benchmark —
      # leaving fsync on would put disk in the critical path of every write and
      # compress the difference between the frameworks.
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    deploy:
      resources:
        limits:
          # Deliberately more than any app gets. When the database saturates
          # first, every framework converges on its ceiling and the result looks
          # like a tie that means nothing.
          cpus: "8"
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d bench"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ── Grit ────────────────────────────────────────────────────────────
  grit:
    <<: *app-limits
    build:
      context: ./grit-bench/apps/api
      dockerfile: Dockerfile
    environment:
      GIN_MODE: release
      PORT: "8080"
      DATABASE_URL: postgres://bench:bench@postgres:5432/bench_grit?sslmode=disable
      JWT_SECRET: benchmark-only-not-a-real-secret
      LOG_LEVEL: error
      # Off: each of these would be work the others are not doing.
      STUDIO_ENABLED: "false"
      PULSE_ENABLED: "false"
      SENTINEL_ENABLED: "false"
      # Empty genuinely disables cache, jobs, worker and cron as of v3.132.0.
      REDIS_URL: ""
      # Passed through so gorm-ab.sh can toggle them without a rebuild. The
      # defaults here match what the scaffold ships.
      DB_PREPARED_STATEMENTS: "${DB_PREPARED_STATEMENTS:-true}"
      DB_SKIP_DEFAULT_TRANSACTION: "${DB_SKIP_DEFAULT_TRANSACTION:-false}"
    ports:
      - "8091:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Laravel ─────────────────────────────────────────────────────────
  laravel:
    <<: *app-limits
    build:
      context: ./laravel-bench
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: base64:0000000000000000000000000000000000000000000=
      LOG_CHANNEL: stderr
      LOG_LEVEL: error
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: bench_laravel
      DB_USERNAME: bench
      DB_PASSWORD: bench
      # Same as every other app here: plaintext to a container on the same
      # network. 'prefer' makes PDO attempt an SSL handshake on every connection
      # and fall back, which nobody else in this comparison is paying for.
      DB_SSLMODE: disable
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
    ports:
      - "8092:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Node / Express ──────────────────────────────────────────────────
  express:
    <<: *app-limits
    build:
      context: ./express-bench
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_URL: postgres://bench:bench@postgres:5432/bench_express
      DB_MAX_OPEN_CONNS: "100"
      # One worker per CPU. A single-threaded Node process on a 4-CPU box would
      # be a strawman, not a comparison.
      NODE_CLUSTER_WORKERS: "4"
    ports:
      - "8094:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Next.js route handlers ──────────────────────────────────────────
  nextjs:
    <<: *app-limits
    build:
      context: ./nextjs-bench
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "8080"
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgres://bench:bench@postgres:5432/bench_nextjs
      DB_MAX_OPEN_CONNS: "100"
      NODE_CLUSTER_WORKERS: "4"
    ports:
      - "8095:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Bun ─────────────────────────────────────────────────────────────
  bun:
    <<: *app-limits
    build:
      context: ./bun-bench
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_URL: postgres://bench:bench@postgres:5432/bench_bun
      DB_MAX_OPEN_CONNS: "100"
      # Bun.serve is one thread per process; these share the socket via
      # reusePort so Bun gets all four CPUs too.
      BUN_WORKERS: "4"
    ports:
      - "8096:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Encore.ts ───────────────────────────────────────────────────────
  # Built by Encore's own CLI (see encore-build.sh) rather than a Dockerfile —
  # there is no plain `tsc && node` path, because the framework compiles your
  # handlers into a Rust-backed runtime. That runtime is most of why Encore is
  # fast, so building it any other way would not be benchmarking Encore.
  encore:
    <<: *app-limits
    image: benchmarks-encore:latest
    environment:
      # Encore reads its infrastructure from this file at boot: which database
      # to use, which services to host, what to listen on.
      ENCORE_INFRA_CONFIG_PATH: /infra.json
      ENCORE_RUNTIME_LOG: error
      PORT: "8080"
      DB_PASSWORD: bench
    volumes:
      - ./encore-bench/infra.json:/infra.json:ro
    ports:
      - "8098:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Django + DRF ────────────────────────────────────────────────────
  django:
    <<: *app-limits
    build:
      context: ./django-bench
      dockerfile: Dockerfile
    environment:
      DJANGO_SETTINGS_MODULE: bench.settings
      DB_NAME: bench_django
      DB_USER: bench
      DB_PASSWORD: bench
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_MAX_OPEN_CONNS: "25"
    ports:
      - "8097:8080"
    depends_on:
      postgres:
        condition: service_healthy
