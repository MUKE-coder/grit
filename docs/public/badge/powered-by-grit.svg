<svg xmlns="http://www.w3.org/2000/svg" width="168" height="28" role="img" aria-label="Powered by Grit">
  <title>Powered by Grit</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="168" height="28" rx="6"/>
    </clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="168" height="28" fill="#0b1120"/>
    <rect x="0" y="0" width="4" height="28" fill="url(#accent)"/>
    <g transform="translate(16, 6)">
      <rect width="16" height="16" rx="4" fill="url(#accent)"/>
      <text x="8" y="12" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace"
            font-size="11" font-weight="700" fill="#0b1120" text-anchor="middle">G</text>
    </g>
    <text x="40" y="18" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
          font-size="11" fill="#94a3b8">Powered by</text>
    <text x="103" y="18" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
          font-size="11" font-weight="700" fill="#e8e8f0">Grit</text>
    <text x="128" y="18" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace"
          font-size="9" fill="#38bdf8">Go+React</text>
  </g>
  <rect width="168" height="28" rx="6" fill="none" stroke="#1e293b"/>
</svg>
